<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Juan Alejandro Cárdenas - Portafolio 2026</title>
  <meta name="title" content="Juan Alejandro Cárdenas - Ingeniero de Sistemas">
  <meta name="description"
    content="Soy Alejo, ingeniero de sistemas de la Universidad del Cauca en Popayán, Colombia. Desarrollo full stack, sistemas embebidos y aeroespaciales.">

  <!-- Open Graph / Facebook -->
  <!-- TODO: add og:url and og:image / twitter:image once the site has a domain -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Juan Alejandro Cárdenas - Ingeniero de Sistemas">
  <meta property="og:description"
    content="Soy Alejo, ingeniero de sistemas de la Universidad del Cauca en Popayán, Colombia. Desarrollo full stack, sistemas embebidos y aeroespaciales.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Juan Alejandro Cárdenas - Ingeniero de Sistemas">
  <meta name="twitter:description"
    content="Soy Alejo, ingeniero de sistemas de la Universidad del Cauca en Popayán, Colombia. Desarrollo full stack, sistemas embebidos y aeroespaciales.">

  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">

  <!-- Terminal font for the Fallout-style overlays -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
